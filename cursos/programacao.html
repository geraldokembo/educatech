<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Curso de Programação | EducaTech</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="verificarAcesso()">
    <nav>
        <div class="logo">EducaTech</div>
        <div class="menu">
            <a href="../index.html">Início</a>
            <a href="#" onclick="logout()" class="btn-logout">Sair</a>
        </div>
    </nav>

    <div class="container">
        <header class="course-header">
            <h1>Curso de Programação Full Stack</h1>
            <img src="https://images.unsplash.com/photo-1587620962725-abab7fe55159?q=80&w=1200" class="featured-image">
        </header>

        <main class="course-detail">
            <h3>O que você vai aprender:</h3>
            <ul>
                <li>Lógica de Programação com Python</li>
                <li>Desenvolvimento Web (HTML5, CSS3, JS)</li>
                <li>Banco de Dados MySQL</li>
            </ul>

            <div id="area-inscricao">
                <!-- JavaScript vai inserir o botão aqui -->
            </div>
        </main>
    </div>

    <script>
        function verificarAcesso() {
            const usuario = localStorage.getItem('usuario_nome');
            const area = document.getElementById('area-inscricao');

            if (usuario) {
                area.innerHTML = `
                    <form action="../php/inscrever.php" method="POST">
                        <input type="hidden" name="curso" value="Programação">
                        <button type="submit" class="cta-button">Confirmar Inscrição no Curso</button>
                    </form>`;
            } else {
                area.innerHTML = `
                    <div class="msg error">
                        Você precisa estar logado para se inscrever. 
                        <a href="../login.html">Faça login aqui</a>.
                    </div>`;
            }
        }
    </script>
</body>
</html>
