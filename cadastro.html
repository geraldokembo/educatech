<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - EducaTech</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <!-- Apenas UM formulário aqui -->
        <form action="cadastrar.php" method="POST">
            <h2>Cadastro de Usuário</h2>
            <p>Preencha os dados abaixo para começar.</p>
            
            <input type="text" name="nome" placeholder="Nome Completo" required>
            <input type="email" name="email" placeholder="Seu melhor e-mail" required>
            <div class="input-group">
                <label for="codigo_invite">Código de Convite (Apenas para Professores)</label>
                <input type="text" name="codigo_invite" id="codigo_invite" placeholder="Ex: EDUCA-2026">
                <small style="color: #64748b;">Deixe em branco se for um Aluno.</small>
            </div>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha (mín. 6 caracteres)" required>
            
            <button type="submit">Finalizar Cadastro</button>
            
            <p>Já tem conta? <a href="login.html">Faça login</a></p>
            <p><a href="index.html">← Voltar ao início</a></p>
        </form>
    </div>

    <script>
        // Validação simples antes de enviar para o PHP
        document.getElementById('formCadastro').onsubmit = function(e) {
            const senha = document.getElementById('senha').value;
            if (senha.length < 6) {
                alert("A senha deve ter no mínimo 6 caracteres!");
                e.preventDefault(); // Cancela o envio se a senha for curta
            }
        };
    </script>
</body>
</html>
